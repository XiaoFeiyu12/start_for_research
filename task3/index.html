<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>TCP 数据实时监控</title>
	<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
			background: #0B0E14;
			color: #F8FAFC;
			padding: 24px;
		}

		.container {
			max-width: 1200px;
			margin: 0 auto;
		}

		header {
			margin-bottom: 24px;
		}

		h1 {
			font-size: 28px;
			font-weight: 600;
			color: #F8FAFC;
			margin-bottom: 8px;
		}

		.status {
			font-size: 14px;
			color: #94A3B8;
			padding: 8px 16px;
			background: #1E293B;
			border-radius: 6px;
			display: inline-block;
		}

		.status.connected {
			color: #4FD1C5;
			background: rgba(79, 209, 197, 0.1);
		}

		.stats-grid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
			gap: 16px;
			margin-bottom: 24px;
		}

		.stat-card {
			background: #1E293B;
			border: 1px solid #334155;
			border-radius: 8px;
			padding: 16px;
		}

		.stat-label {
			font-size: 12px;
			color: #94A3B8;
			text-transform: uppercase;
			letter-spacing: 0.5px;
			margin-bottom: 8px;
		}

		.stat-value {
			font-size: 32px;
			font-weight: 600;
			color: #38BDF8;
		}

		.chart-container {
			background: #1E293B;
			border: 1px solid #334155;
			border-radius: 8px;
			padding: 24px;
			height: 500px;
			position: relative;
		}

		canvas {
			max-height: 100%;
		}

		.footer {
			margin-top: 24px;
			text-align: center;
			font-size: 12px;
			color: #64748B;
		}
	</style>
</head>
<body>
	<div class="container">
		<header>
			<h1>TCP 数据实时监控</h1>
			<div class="status" id="status">⏳ 正在连接...</div>
		</header>

		<div class="stats-grid">
			<div class="stat-card">
				<div class="stat-label">当前值</div>
				<div class="stat-value" id="current-value">--</div>
			</div>
			<div class="stat-card">
				<div class="stat-label">最大值</div>
				<div class="stat-value" id="max-value">--</div>
			</div>
			<div class="stat-card">
				<div class="stat-label">最小值</div>
				<div class="stat-value" id="min-value">--</div>
			</div>
			<div class="stat-card">
				<div class="stat-label">平均值</div>
				<div class="stat-value" id="avg-value">--</div>
			</div>
		</div>

		<div class="chart-container">
			<canvas id="chart"></canvas>
		</div>

		<div class="footer">
			最近 20 个数据点 | 每秒自动刷新
		</div>
	</div>

	<script>
		// 图表配置
		const ctx = document.getElementById('chart').getContext('2d');
		const chart = new Chart(ctx, {
			type: 'line',
			data: {
				labels: [],
				datasets: [{
					label: '接收数据',
					data: [],
					borderColor: '#38BDF8',
					backgroundColor: 'rgba(56, 189, 248, 0.1)',
					borderWidth: 3,
					tension: 0.4,
					fill: true,
					pointRadius: 4,
					pointBackgroundColor: '#38BDF8',
					pointBorderColor: '#0B0E14',
					pointBorderWidth: 2
				}]
			},
			options: {
				responsive: true,
				maintainAspectRatio: false,
				plugins: {
					legend: {
						display: false
					},
					tooltip: {
						backgroundColor: '#0F172A',
						titleColor: '#F8FAFC',
						bodyColor: '#94A3B8',
						borderColor: '#334155',
						borderWidth: 1,
						padding: 12,
						displayColors: false
					}
				},
				scales: {
					x: {
						grid: {
							color: '#1E293B'
						},
						ticks: {
							color: '#94A3B8'
						}
					},
					y: {
						grid: {
							color: '#1E293B'
						},
						ticks: {
							color: '#94A3B8'
						},
						beginAtZero: true
					}
				}
			}
		});

		// 获取数据并更新图表
		async function fetchData() {
			try {
				const response = await fetch('/api/data');
				if (!response.ok) throw new Error('Network error');

				const data = await response.json();

				if (data.length === 0) {
					document.getElementById('status').textContent = '⏳ 等待数据...';
					document.getElementById('status').className = 'status';
					return;
				}

				// 更新状态
				document.getElementById('status').textContent = '✅ 实时连接';
				document.getElementById('status').className = 'status connected';

				// 反转数据（从旧到新）
				data.reverse();

				// 提取数据值
				const values = data.map(d => d.value);
				const labels = data.map((_, i) => i + 1);

				// 更新图表
				chart.data.labels = labels;
				chart.data.datasets[0].data = values;
				chart.update('none'); // 禁用动画以提高性能

				// 计算统计信息
				const current = values[values.length - 1];
				const max = Math.max(...values);
				const min = Math.min(...values);
				const avg = Math.round(values.reduce((a, b) => a + b, 0) / values.length);

				document.getElementById('current-value').textContent = current;
				document.getElementById('max-value').textContent = max;
				document.getElementById('min-value').textContent = min;
				document.getElementById('avg-value').textContent = avg;

			} catch (error) {
				console.error('获取数据失败:', error);
				document.getElementById('status').textContent = '❌ 连接失败';
				document.getElementById('status').className = 'status';
			}
		}

		// 初始加载
		fetchData();

		// 每秒刷新
		setInterval(fetchData, 1000);
	</script>
</body>
</html>
